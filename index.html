<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Application Portal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="background-glow glow-one"></div>
<div class="background-glow glow-two"></div>

<main>

    <header>

        <div class="badge">
            APPLICATION PORTAL
        </div>

        <h1>
            Apply to the team.
        </h1>

        <p>
            Choose an application below and answer all of the questions.
        </p>

        <div class="username-box">

            <label for="username">
                Discord Username
            </label>

            <input
                id="username"
                type="text"
                maxlength="100"
                placeholder="@username"
                autocomplete="off"
            >

        </div>

    </header>


    <!-- THESE BUTTONS ALWAYS STAY VISIBLE -->

    <section class="application-buttons">

        <button
            class="application-card"
            data-application="dev"
        >

            <span class="card-icon">
                🛠️
            </span>

            <span class="card-title">
                Dev Apps
            </span>

            <span class="card-description">
                Apply to become a developer.
            </span>

        </button>


        <button
            class="application-card"
            data-application="mod"
        >

            <span class="card-icon">
                🛡️
            </span>

            <span class="card-title">
                Mod Apps
            </span>

            <span class="card-description">
                Apply to become a moderator.
            </span>

        </button>


        <button
            class="application-card"
            data-application="valueList"
        >

            <span class="card-icon">
                💎
            </span>

            <span class="card-title">
                Value List Apps
            </span>

            <span class="card-description">
                Apply to help manage the value list.
            </span>

        </button>

    </section>


    <!-- QUESTIONS APPEAR HERE -->

    <section
        id="applicationArea"
        class="application-area hidden"
    >

        <div class="application-heading">

            <div
                id="applicationBadge"
                class="badge"
            ></div>

            <h2 id="applicationTitle"></h2>

            <p id="applicationCount"></p>

        </div>


        <form id="applicationForm">

            <!-- JavaScript puts questions here -->

        </form>


        <div class="submit-area">

            <div
                id="errorMessage"
                class="error-message"
            ></div>

            <button
                id="submitButton"
                class="submit-button"
                type="submit"
                form="applicationForm"
            >
                Submit Application
            </button>

        </div>

    </section>


    <!-- SUCCESS MESSAGE -->

    <section
        id="successArea"
        class="success-area hidden"
    >

        <div class="success-icon">
            ✓
        </div>

        <h2>
            Application submitted!
        </h2>

        <p>
            Your application was successfully sent.
        </p>

        <p>
            Application ID:
            <strong id="applicationID"></strong>
        </p>

    </section>

</main>


<script src="questions.js"></script>
<script src="app.js"></script>

</body>
</html>
