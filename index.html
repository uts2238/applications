<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Applications</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <main>

        <header>

            <div class="top-badge">
                APPLICATIONS
            </div>

            <h1>Applications</h1>

            <p>
                Choose an application below to get started.
            </p>


            <!-- APPLICANT INFORMATION -->

            <div class="applicant-panel">

                <div class="applicant-header">

                    <div>
                        <span class="applicant-title">
                            Applicant information
                        </span>

                        <span class="applicant-subtitle">
                            Required before applying
                        </span>
                    </div>

                    <span class="required-badge">
                        REQUIRED
                    </span>

                </div>


                <div class="applicant-fields">

                    <div class="applicant-field">

                        <label for="username">
                            Discord Username
                        </label>

                        <input
                            id="username"
                            type="text"
                            maxlength="100"
                            placeholder="your username"
                            autocomplete="off"
                            spellcheck="false"
                        >

                    </div>


                    <div class="applicant-field age-field">

                        <label for="age">
                            Age
                        </label>

                        <input
                            id="age"
                            type="number"
                            min="1"
                            max="99"
                            placeholder="13"
                            inputmode="numeric"
                            autocomplete="off"
                        >

                    </div>

                </div>


                <div class="applicant-note">
                    Use your Discord username. You must be 13 or older to apply.
                </div>

            </div>

        </header>


        <!-- APPLICATION TYPES -->

        <section class="application-buttons">

            <button
                class="application-card"
                type="button"
                data-application="dev"
            >

                <span class="card-icon">
                    DEV
                </span>

                <span class="card-title">
                    Developer
                </span>

                <span class="card-description">
                    Apply to help develop and maintain the project.
                </span>

            </button>


            <button
                class="application-card"
                type="button"
                data-application="mod"
            >

                <span class="card-icon">
                    MOD
                </span>

                <span class="card-title">
                    Moderator
                </span>

                <span class="card-description">
                    Help keep the community safe and enjoyable.
                </span>

            </button>


            <button
                class="application-card"
                type="button"
                data-application="valueList"
            >

                <span class="card-icon">
                    VAL
                </span>

                <span class="card-title">
                    Value List
                </span>

                <span class="card-description">
                    Help maintain accurate item values and trades.
                </span>

            </button>

        </section>


        <!-- APPLICATION -->

        <section
            id="applicationArea"
            class="application-area hidden"
        >

            <div class="application-heading">

                <div
                    id="applicationBadge"
                    class="application-badge"
                ></div>

                <h2 id="applicationTitle"></h2>

                <p id="applicationCount"></p>

            </div>


            <form id="applicationForm">

                <div id="questionsContainer"></div>

            </form>


            <div class="submit-area">

                <div
                    id="errorMessage"
                    class="error-message"
                    aria-live="polite"
                ></div>

                <button
                    id="submitButton"
                    class="submit-button"
                    type="button"
                >
                    Submit Application
                </button>

            </div>

        </section>


        <!-- SUCCESS -->

        <section
            id="successArea"
            class="success-area hidden"
        >

            <div class="success-icon">
                ✓
            </div>

            <h2>
                Application submitted
            </h2>

            <p>
                Your application has been sent successfully.
            </p>

            <p>
                Application ID:
                <strong id="applicationID"></strong>
            </p>

        </section>

    </main>


    <script src="questions.js"></script>
    <script src="app.js"></script>

</body>

</html>
