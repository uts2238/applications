<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Applications</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main>

    <header>

        <div class="top-badge">
            APPLICATIONS
        </div>

        <h1>Applications</h1>

        <p>
            Fill in your details and choose an application below.
        </p>

        <div class="applicant-panel">

            <div class="applicant-header">

                <div>
                    <span class="applicant-title">
                        Applicant information
                    </span>

                    <span class="applicant-subtitle">
                        Your Discord details
                    </span>
                </div>

                <span class="required-badge">
                    REQUIRED
                </span>

            </div>

            <div class="applicant-fields">

                <div class="applicant-field">

                    <label for="username">
                        Discord Username
                    </label>

                    <input
                        id="username"
                        type="text"
                        maxlength="100"
                        placeholder="Username"
                        autocomplete="off"
                        spellcheck="false"
                    >

                </div>

                <div class="applicant-field age-field">

                    <label for="age">
                        Age
                    </label>

                    <input
                        id="age"
                        type="number"
                        min="1"
                        max="120"
                        placeholder="Age"
                        inputmode="numeric"
                        autocomplete="off"
                    >

                </div>

            </div>

            <div class="applicant-note">
                You must be at least 13 years old to submit an application.
            </div>

        </div>

    </header>


    <section class="application-buttons">

        <!-- CONTENT CREATOR -->

        <button
            class="application-card"
            type="button"
            data-application="cc"
        >

            <span class="card-icon">
                CC
            </span>

            <span class="card-title">
                Content Creator
            </span>

            <span class="card-description">
                Create videos, Shorts and other content featuring the game.
            </span>

        </button>


        <!-- DEVELOPER -->

        <button
            class="application-card"
            type="button"
            data-application="dev"
        >

            <span class="card-icon">
                DEV
            </span>

            <span class="card-title">
                Developer
            </span>

            <span class="card-description">
                Help develop and improve the game.
            </span>

        </button>


        <!-- MODERATOR -->

        <button
            class="application-card"
            type="button"
            data-application="mod"
        >

            <span class="card-icon">
                MOD
            </span>

            <span class="card-title">
                Moderator
            </span>

            <span class="card-description">
                Help moderate the community.
            </span>

        </button>


        <!-- VALUE LIST -->

        <button
            class="application-card"
            type="button"
            data-application="valueList"
        >

            <span class="card-icon">
                VAL
            </span>

            <span class="card-title">
                Value List
            </span>

            <span class="card-description">
                Help maintain accurate values and trading information.
            </span>

        </button>


        <!-- TESTER -->

        <button
            class="application-card"
            type="button"
            data-application="test"
        >

            <span class="card-icon">
                TEST
            </span>

            <span class="card-title">
                Tester
            </span>

            <span class="card-description">
                Find bugs, test updates and help improve the game.
            </span>

        </button>

    </section>


    <section
        id="applicationArea"
        class="application-area hidden"
    >

        <div class="application-heading">

            <div
                id="applicationBadge"
                class="application-badge"
            ></div>

            <h2 id="applicationTitle"></h2>

            <p id="applicationCount"></p>

        </div>


        <form id="applicationForm">
            <!-- Questions are inserted here -->
        </form>


        <div class="submit-area">

            <div
                id="errorMessage"
                class="error-message"
            ></div>

            <button
                id="submitButton"
                class="submit-button"
                type="submit"
                form="applicationForm"
            >
                Submit Application
            </button>

        </div>

    </section>


    <section
        id="successArea"
        class="success-area hidden"
    >

        <div class="success-icon">
            ✓
        </div>

        <h2>
            Application submitted
        </h2>

        <p>
            Your application has been sent successfully.
        </p>

        <p>
            Application ID:
            <strong id="applicationID"></strong>
        </p>

    </section>

</main>


<script src="questions.js"></script>
<script src="app.js"></script>

</body>

</html>
