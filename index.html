<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Applications</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="background-glow glow-one"></div>
<div class="background-glow glow-two"></div>

<main>

    <header>

        <div class="badge">
            APPLICATIONS
        </div>

        <h1>Applications</h1>

        <p>
            Choose an application below to get started.
        </p>

        <div class="username-box">

            <label for="username">
                Discord Username
            </label>

            <input
                id="username"
                type="text"
                maxlength="100"
                placeholder="@username"
                autocomplete="off"
            >

        </div>

    </header>


    <section class="application-buttons">

        <button
            class="application-card"
            data-application="dev"
            type="button"
        >
            <span class="card-icon">🛠️</span>

            <span class="card-title">
                Dev Apps
            </span>

            <span class="card-description">
                Developer application
            </span>
        </button>


        <button
            class="application-card"
            data-application="mod"
            type="button"
        >
            <span class="card-icon">🛡️</span>

            <span class="card-title">
                Mod Apps
            </span>

            <span class="card-description">
                Moderator application
            </span>
        </button>


        <button
            class="application-card"
            data-application="valueList"
            type="button"
        >
            <span class="card-icon">💎</span>

            <span class="card-title">
                Value List Apps
            </span>

            <span class="card-description">
                Value list application
            </span>
        </button>

    </section>


    <section
        id="applicationArea"
        class="application-area hidden"
    >

        <div class="application-heading">

            <div
                id="applicationBadge"
                class="badge"
            ></div>

            <h2 id="applicationTitle"></h2>

            <p id="applicationCount"></p>

        </div>


        <form id="applicationForm"></form>


        <div class="submit-area">

            <div
                id="errorMessage"
                class="error-message"
            ></div>

            <button
                id="submitButton"
                class="submit-button"
                type="submit"
                form="applicationForm"
            >
                Submit Application
            </button>

        </div>

    </section>


    <section
        id="successArea"
        class="success-area hidden"
    >

        <div class="success-icon">
            ✓
        </div>

        <h2>
            Application submitted
        </h2>

        <p>
            Your application has been sent.
        </p>

        <p>
            Application ID:
            <strong id="applicationID"></strong>
        </p>

    </section>

</main>


<script src="questions.js"></script>
<script src="app.js"></script>

</body>
</html>
